# Application bindings (omarchy stock)
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
unbind = SUPER, SPACE
unbind = SHIFT ALT, L
unbind = SUPER, W
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
unbind = SUPER, ALT, SPACE
unbind = SUPER, ALT, F
unbind = SUPER, ESCAPE
unbind = SUPER, T
unbind = SUPER, G
unbind = SUPER, F
unbind = SUPER, 1
unbind = SUPER, 2
unbind = SUPER, 3
unbind = SUPER, 4
unbind = SUPER, 5
unbind = SUPER, 6
unbind = SUPER, 7
unbind = SUPER, 8
unbind = SUPER, 9
unbind = SUPER, 0
unbind = SUPER, SHIFT, 0
unbind = SUPER, SHIFT, 1
unbind = SUPER, SHIFT, 2
unbind = SUPER, SHIFT, 3
unbind = SUPER, SHIFT, 4
unbind = SUPER, SHIFT, 5
unbind = SUPER, SHIFT, 6
unbind = SUPER, SHIFT, 7
unbind = SUPER, SHIFT, 8
unbind = SUPER, SHIFT, 9
unbind = SUPER, SHIFT, 10

#bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

##############################################################################
### SID'S BINDS
### Modifier: ALT (no conflicts with omarchy's SUPER binds)
##############################################################################

$mainMod = ALT

# Core app launches
bind = $mainMod, Q, killactive
bind = $mainMod, T, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = $mainMod, S, Omarchy menu, exec, omarchy-menu
bind = $mainMod, W, exec, firefox
bind = $mainMod, F, exec, uwsm-app -- nautilus --new-window
bind = $mainMod, ESCAPE, exec, bash -c 'hyprlock'

# Toggle float + center current window
bind = $mainMod, I, exec, ~/.config/hypr/scripts/toggle-float-center.sh

# Focus movement (HJKL)
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, d

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
